name: Test Cookbook Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint --if-present || true

      - name: Type check
        run: npm run type-check --if-present

      - name: Build
        run: npm run build --if-present

      - name: Check formatting
        run: npm run format:check --if-present || true

      - name: Verify examples structure
        run: |
          for dir in */; do
            if [ -f "$dir/src/index.ts" ]; then
              echo "✓ $dir has src/index.ts"
            else
              echo "✗ $dir missing src/index.ts"
            fi
            
            if [ -f "$dir/README.md" ]; then
              echo "✓ $dir has README.md"
            else
              echo "✗ $dir missing README.md"
            fi
            
            if [ -f "$dir/.env.example" ]; then
              echo "✓ $dir has .env.example"
            else
              echo "✗ $dir missing .env.example"
            fi
          done
